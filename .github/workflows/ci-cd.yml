name: CI/CD

on:
  pull_request:              # check every pull request
  push:
    branches: [ main ]       # and every merge to main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
      run: |
        pip install -r requirements-dev.txt
        pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
